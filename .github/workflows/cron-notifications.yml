name: Cron Notifications

on:
  schedule:
    # Run at 8 AM, 2 PM, and 8 PM India Standard Time (UTC+5:30)
    - cron: '30 2 * * *'
    - cron: '30 8 * * *'
    - cron: '30 14 * * *'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification cron job
        run: |
          curl -X POST \
            "${{ secrets.NOTIFICATION_URL }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"trigger": "cron"}'
        continue-on-error: true
