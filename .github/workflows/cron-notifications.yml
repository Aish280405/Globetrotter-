name: Cron Notifications

on:
  schedule:
    # Run at 8 AM, 2 PM, and 8 PM UTC daily
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification cron job
        run: |
          curl -X POST \
            "${{ secrets.NOTIFICATION_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"trigger": "cron"}'
        continue-on-error: true
